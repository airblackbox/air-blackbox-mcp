[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Ship only the package and metadata - keep demo assets, benchmarks,
# and internal docs out of the PyPI tarball.
only-include = [
    "air_blackbox_mcp",
    "tests/test_scanner.py",
    "README.md",
    "LICENSE",
    "server.json",
]

[project]
name = "air-blackbox-mcp"
version = "0.2.4"
description = "MCP server for EU AI Act compliance scanning with GDPR and bias detection - scan, analyze, remediate, and protect AI agent code"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "Jason Shotwell", email = "jason.j.shotwell@gmail.com"}]
keywords = ["eu-ai-act", "compliance", "mcp", "ai-safety", "guardrails", "gdpr", "bias"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    # <2 is load-bearing: mcp 2.0 removed mcp.server.fastmcp, which server.py
    # imports, so an unpinned install resolves to 2.x and the server cannot
    # import at all. The SDK repo hit the identical break (airblackbox#60).
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
# Floor raised from >=1.6.0: that span reached 1.13 with no way to tell which
# rules produced a Tier 5 result. Results now record sdk_version, and the floor
# is the version this package is actually tested against. Major cap so a 2.x
# SDK cannot silently change findings.
full = ["air-blackbox>=1.13,<2"]
ollama = ["ollama"]

[project.urls]
Homepage = "https://github.com/airblackbox/air-blackbox-mcp"
Documentation = "https://airblackbox.ai"
Repository = "https://github.com/airblackbox/air-blackbox-mcp"
