name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current: requires-python is >=3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Base install: the built-in scanner must keep working without the SDK.
        run: pip install -e . pytest
      - name: Test (built-in scanner)
        run: python -m pytest tests/ -q
      - name: Install the SDK
        # The scanning tools switch to the SDK when it is installed; the same
        # suite must pass on that engine too, plus the SDK-only tests.
        run: pip install -e ".[full]"
      - name: Test (SDK scanner)
        run: python -m pytest tests/ -q
