name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current: requires-python is >=3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # Base install only: the built-in scanner path is what Tiers 1-4 always
        # run, and the provenance sweep must pass without the optional SDK.
        run: pip install -e . pytest
      - name: Test
        run: python -m pytest tests/ -q
